name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==0.13.5"
      - name: Install locked dependencies
        run: uv sync --locked --group test
      - name: Run tests
        run: uv run --no-sync python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser companion
        run: node --test tests/test_browser_service_worker.js
