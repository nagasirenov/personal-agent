# Copy to config.local.toml. Never commit real identities or bot tokens.
data_dir = ".state"
primary_id = 100001        # EXAMPLE ONLY: replace before live use
secondary_id = 100002      # EXAMPLE ONLY: distinct second account
token_env = "TELEGRAM_BOT_TOKEN"

# Official Codex with existing ChatGPT login; no OpenAI API key required.
# doctor/demo remain offline regardless of this setting.
backend = "codex_subscription"
model = "gpt-6-sol"
reasoning = "medium"
# read: observations only; full: PRIMARY can also write files/run PowerShell.
pc_access = "read"
web_enabled = false
web_base_url = "http://127.0.0.1:17841/v1"
codex_executable = "codex"
observe_interval = 5.0
timezone_name = "Europe/Moscow"
max_attachment_bytes = 20971520
max_pending_tasks = 16
brain_timeout = 180.0

# Optional local voice recognition. No automatic downloads or cloud STT.
whisper_executable = ""
whisper_model = ""
ffmpeg_executable = ""

# Sending files to Telegram: the hosted Bot API caps bot uploads at 50 MB (videos are re-encoded to fit).
# A local Bot API server raises that to 2000 MB: telegram_api_base = "http://127.0.0.1:8081".
telegram_api_base = "https://api.telegram.org"
# Other files over the cap are uploaded to Google Drive with rclone and sent as a link (otherwise split
# into .partNN files). One-time setup: install rclone, run `rclone config` (remote "gdrive").
drive_remote = ""            # for example "gdrive:PersonalAgent"
rclone_executable = ""       # empty = rclone on PATH or the WinGet install

# The model may draw pictures with the built-in image generator when asked (all accounts and groups).
image_generation = true

