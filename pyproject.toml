[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-personal-agent"
version = "0.1.0"
description = "Local-first Telegram memory and passive Windows observer"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "imageio-ffmpeg==0.6.0", "rlottie-python==1.3.8", "Pillow>=12,<13", "watchdog>=6,<8", "yt-dlp>=2026.10.26"]

[dependency-groups]
test = ["pytest>=8"]

[project.scripts]
personal-agent = "personal_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["personal_agent*"]
